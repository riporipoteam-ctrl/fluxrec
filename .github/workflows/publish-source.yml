name: Publish verified Flux Rec source
on:
  push:
    paths:
      - .github/workflows/publish-source.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reconstruct verified source archive
        shell: bash
        run: |
          set -euo pipefail
          cat .bootstrap/source.b64.* | base64 --decode > /tmp/fluxrec-source.zip
          echo "1f8f9d2d8ccc55eb5d460ce8395a762aa1b723c9dc341c268c5e9538b7ee96df  /tmp/fluxrec-source.zip" | sha256sum --check -
          python - <<'PY'
          import zipfile
          with zipfile.ZipFile("/tmp/fluxrec-source.zip") as archive:
              archive.extractall(".")
          PY
          rm -rf .bootstrap .github/workflows/publish-source.yml
      - name: Commit exact source tree
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Publish reproducible Flux Rec source and local hosting stack"
          git push origin HEAD:main
