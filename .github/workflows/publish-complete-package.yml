name: Publish complete Flux Rec package
on:
  push:
    paths:
      - .github/workflows/publish-complete-package.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reconstruct verified package
        shell: bash
        run: |
          set -euo pipefail
          cat .bootstrap-update/update.b64.* | base64 --decode > /tmp/fluxrec-update.zip
          echo "4931fc18d4c42c006ee4a2fef2686d4f321736c4ca2383b4e19d18183a5bef22  /tmp/fluxrec-update.zip" | sha256sum --check -
          python - <<'PY'
          import zipfile
          with zipfile.ZipFile("/tmp/fluxrec-update.zip") as archive:
              archive.extractall(".")
          PY
          rm -rf .bootstrap-update .github/workflows/publish-complete-package.yml
      - name: Commit package
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add complete depot inventory and built Flux Rec package"
          git push origin HEAD:main
